name: Android checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Contract tests
        run: |
          mkdir -p build/contract-tests
          javac -d build/contract-tests app/src/main/java/app/veyra/model/*.java tests/ContractTest.java
          java -cp build/contract-tests ContractTest
      - run: gradle --no-daemon :app:assembleDebug :app:lintDebug :app:testDebugUnitTest
